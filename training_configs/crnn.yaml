model:
  name: "CRNNBaseline"
  spec_type: "mel"

data:
  train_path: "/kaggle/input/datasets/kostaskaimakis/cnn-rnn-mel-features/cnn_mel_features/training"
  val_path:   "/kaggle/input/datasets/kostaskaimakis/cnn-rnn-mel-features/cnn_mel_features/validation"
  test_path:  "/kaggle/input/datasets/kostaskaimakis/cnn-rnn-mel-features/cnn_mel_features/testing"
  feature_extension: ".npy"

training:
  seed: 42
  batch_size: 32
  epochs: 30
  early_stop_patience: 5
  lr_reduce_factor: 0.5
  lr_reduce_patience: 3
  num_workers: 2
  output_dir: "results/crnn"

experiments:
  # Baseline
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary CNN depth
  - {cnn_depth: 2, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {cnn_depth: 4, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary CNN channel width
  - {cnn_depth: 3, base_channels: 16, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {cnn_depth: 3, base_channels: 64, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary RNN depth
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 1, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 3, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary learning rate
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 1.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 1.0e-3, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary dropout
  - {cnn_depth: 3, base_channels: 32, num_rnn_layers: 2, rnn_hidden: 128, lr: 5.0e-4, dropout: 0.3, weight_decay: 1.0e-4}
