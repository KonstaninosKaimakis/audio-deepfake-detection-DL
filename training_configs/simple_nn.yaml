model:
  name: "DeepfakeDetectorMLP"

data:
  train_path: "/kaggle/input/datasets/kostaskaimakis/for-features/features/training_features_20_128_256_128.parquet"
  val_path:   "/kaggle/input/datasets/kostaskaimakis/for-features/features/testing_features_20_128_256_128.parquet"
  test_path:  "/kaggle/input/datasets/kostaskaimakis/for-features/itw_features_20_128_256_128.parquet"
  num_workers: 2

training:
  seed: 42
  batch_size: 64
  epochs: 30
  early_stop_patience: 5
  lr_reduce_factor: 0.5
  lr_reduce_patience: 3
  threshold: 0.5
  output_dir: "results/simple_nn"

experiments:
  # Baseline
  - {hidden_sizes: [256, 128, 64],      lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary depth (shallower)
  - {hidden_sizes: [256, 128],          lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {hidden_sizes: [128],               lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary depth (deeper)
  - {hidden_sizes: [256, 128, 64, 32],  lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {hidden_sizes: [512, 256, 128, 64], lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary width (wider)
  - {hidden_sizes: [512, 256, 128],     lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary learning rate
  - {hidden_sizes: [256, 128, 64],      lr: 1.0e-4, dropout: 0.5, weight_decay: 1.0e-4}
  - {hidden_sizes: [256, 128, 64],      lr: 1.0e-3, dropout: 0.5, weight_decay: 1.0e-4}
  # Vary dropout
  - {hidden_sizes: [256, 128, 64],      lr: 5.0e-4, dropout: 0.3, weight_decay: 1.0e-4}
  # Vary weight decay
  - {hidden_sizes: [256, 128, 64],      lr: 5.0e-4, dropout: 0.5, weight_decay: 1.0e-3}
